# 只做JSON格式化 · Nginx 站点配置
# 放置位置：/etc/nginx/conf.d/json-pretty.conf
# 生效命令：sudo nginx -t && sudo systemctl reload nginx
#
# 使用顺序：
#   1. 先用这份配置，让域名能通过 HTTP 访问
#   2. 再运行：sudo certbot --nginx -d json.example.com
#      certbot 会自动改写本文件，补上 443 监听与 HTTPS 跳转，并自动续期
#   3. 若证书已手动备好，直接把下面的 ssl 段落注释解开即可

server {
    listen      80;
    listen      [::]:80;
    server_name json.example.com;

    access_log /var/log/nginx/json-pretty.access.log;
    error_log  /var/log/nginx/json-pretty.error.log;

    # 本应用没有文件上传，页面内容不会提交到服务端，
    # 因此不需要调大 client_max_body_size（保持 Nginx 默认即可）。

    location / {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        # ★ 关键：/api/fetch 抓取远端链接最长会等 12s，
        #   这里的读取超时必须大于它，否则抓取会被 Nginx 提前掐断返回 504。
        proxy_read_timeout    30s;
    }
}

